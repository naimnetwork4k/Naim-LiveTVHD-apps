name: Build Android APK with Custom Logo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap init "Naim LiveTVHD" "com.naim.livetvhd" --web-dir=www
          npx cap add android

      - name: Apply Custom Logo and Cleartext Traffic
        run: |
          # HTTP স্ট্রিম সাপোর্ট অন করা
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # আপনার লোগোটি যেন স্প্ল্যাশ স্ক্রিন ও আইকন হিসেবে কাজ করে সেজন্য সরাসরি রিসোর্স ফোল্ডারে সেট করা
          mkdir -p android/app/src/main/res/drawable
          if [ -f "www/icon.png" ]; then
            cp www/icon.png android/app/src/main/res/drawable/splash.png
          elif [ -f "www/icon.jpg" ]; then
            cp www/icon.jpg android/app/src/main/res/drawable/splash.png
          fi

          # বিভিন্ন রেজোলিউশনের আইকন ফোল্ডারে লোগো কপি করা
          for sz in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$sz
            if [ -f "www/icon.png" ]; then
              cp www/icon.png android/app/src/main/res/mipmap-$sz/ic_launcher.png
              cp www/icon.png android/app/src/main/res/mipmap-$sz/ic_launcher_round.png
              cp www/icon.png android/app/src/main/res/mipmap-$sz/ic_launcher_foreground.png
            elif [ -f "www/icon.jpg" ]; then
              cp www/icon.jpg android/app/src/main/res/mipmap-$sz/ic_launcher.png
              cp www/icon.jpg android/app/src/main/res/mipmap-$sz/ic_launcher_round.png
              cp www/icon.jpg android/app/src/main/res/mipmap-$sz/ic_launcher_foreground.png
            fi
          done

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-LiveTVHD-App-With-Logo
          path: android/app/build/outputs/apk/debug/app-debug.apk
