name: Build Android APK with Custom Logo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap init "Naim LiveTVHD" "com.naim.livetvhd" --web-dir=www
          npx cap add android

      - name: Add Custom Logo to Android App Icons and Splash
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # আপনার আপলোড করা icon.png লোগোটিকে সব আইকন সাইজে সেট করে দেওয়া
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          if [ -f "www/icon.png" ]; then
            cp www/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp www/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp www/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp www/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-LiveTVHD-App-With-Logo
          path: android/app/build/outputs/apk/debug/app-debug.apk
