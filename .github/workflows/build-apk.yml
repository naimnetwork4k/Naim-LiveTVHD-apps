name: Build Android APK with Custom Logo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap init "Naim LiveTVHD" "com.naim.livetvhd" --web-dir=www
          npx cap add android

      - name: Enable Cleartext Traffic & Copy Custom Logo to Android
        run: |
          # HTTP স্ট্রিম সাপোর্ট ঠিক করা
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # আপনার দেওয়া icon.png লোগোটিকে অ্যান্ড্রয়েডের ডিফল্ট আইকন ফোল্ডারে কপি করে দেওয়া
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "www/icon.png" ]; then
            cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-LiveTVHD-App-With-Logo
          path: android/app/build/outputs/apk/debug/app-debug.apk
